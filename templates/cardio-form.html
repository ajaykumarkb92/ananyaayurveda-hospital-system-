<!-- Cardiology Assessment Form -->
<div class="specialized-section">
    <h3 class="specialized-title">❤️ Cardiology Assessment</h3>
    <div class="form-row">
        <div class="form-group half">
            <label>Heart Rate</label>
            <input type="number" ng-model="vm.caseData.specialized.cardio.heartRate" placeholder="BPM">
        </div>
        <div class="form-group half">
            <label>Blood Pressure</label>
            <input type="text" ng-model="vm.caseData.specialized.cardio.bp" placeholder="Systolic/Diastolic">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group half">
            <label>Pulse Type (Ayurvedic)</label>
            <select ng-model="vm.caseData.specialized.cardio.pulseType">
                <option value="">Select Pulse Type</option>
                <option value="Vata Pulse (Snake-like)">Vata Pulse (Snake-like)</option>
                <option value="Pitta Pulse (Frog-like)">Pitta Pulse (Frog-like)</option>
                <option value="Kapha Pulse (Swan-like)">Kapha Pulse (Swan-like)</option>
            </select>
        </div>
        <div class="form-group half">
            <label>Chest Pain</label>
            <select ng-model="vm.caseData.specialized.cardio.chestPain">
                <option value="">Select</option>
                <option value="None">None</option>
                <option value="Mild">Mild</option>
                <option value="Moderate">Moderate</option>
                <option value="Severe">Severe</option>
            </select>
        </div>
    </div>
</div>
