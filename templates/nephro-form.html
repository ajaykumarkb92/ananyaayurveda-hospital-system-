<!-- Nephrology Assessment Form -->
<div class="specialized-section">
    <h3 class="specialized-title">💧 Nephrology Assessment</h3>
    <div class="form-row">
        <div class="form-group half">
            <label>Urine Output</label>
            <select ng-model="vm.caseData.specialized.nephro.urineOutput">
                <option value="">Select Urine Output</option>
                <option value="Normal">Normal</option>
                <option value="Reduced (Oliguria)">Reduced (Oliguria)</option>
                <option value="Increased (Polyuria)">Increased (Polyuria)</option>
                <option value="Absent (Anuria)">Absent (Anuria)</option>
            </select>
        </div>
        <div class="form-group half">
            <label>Edema Location</label>
            <input type="text" ng-model="vm.caseData.specialized.nephro.edema" placeholder="e.g., Feet, Ankles, Face">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group half">
            <label>Kidney Function (Clinical)</label>
            <textarea rows="2" ng-model="vm.caseData.specialized.nephro.kidneyFunction" placeholder="Enter clinical notes on kidney function..."></textarea>
        </div>
        <div class="form-group half">
            <label>Blood Pressure (BP)</label>
            <input type="text" ng-model="vm.caseData.specialized.nephro.bp" placeholder="e.g., 130/85">
        </div>
    </div>
</div>
