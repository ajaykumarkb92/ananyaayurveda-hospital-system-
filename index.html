<!DOCTYPE html>
<html lang="en" ng-app="ayurvedicApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananya Ayurveda | Hospital Management System</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- AngularJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="MainController as vm">
    
    <div class="container">
        <!-- Include Header -->
        <div ng-include="'templates/header.html'"></div>
        
        <!-- Include Search Section -->
        <div ng-include="'templates/search-section.html'"></div>
        
        <!-- Include Stats Bar -->
        <div ng-include="'templates/stats.html'"></div>
        
        <!-- Include Patient Form (shows conditionally) -->
        <div ng-include="'templates/patient-form.html'" ng-show="vm.showPatientForm"></div>
        
        <!-- Include Case Studies Section -->
        <div ng-include="'templates/case-studies.html'" ng-show="vm.showExistingPatient && !vm.isNewPatient"></div>
        
        <!-- Include Search Results -->
        <div ng-include="'templates/search-results.html'" ng-show="vm.searchResults.length > 0"></div>
        
        <!-- Include Testimonials -->
        <div ng-include="'templates/testimonials.html'"></div>
    </div>
    
    <!-- Message Toast -->
    <div ng-show="vm.message" class="message {{vm.messageType}}">
        {{vm.message}}
    </div>
    
    <!-- Scripts -->
    <script src="database.js"></script>
    <script src="app.js"></script>
</body>
</html>
